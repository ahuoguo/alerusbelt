name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - ghcr.io/logsem/clutch/docker-x86-64
      max-parallel: 4
      # don't cancel all in-progress jobs if one matrix job fails:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: coq-community/docker-coq-action@v1
        with:
          opam_file: 'rocq-verusbelt.opam'
          custom_image: ${{ matrix.image }}
          install: |
            startGroup "Configure opam repositories"
              opam repo add --this-switch rocq-released https://rocq-prover.org/opam/released || true
              opam update -y
            endGroup
            startGroup "Pin VerusBelt-specific dependencies"
              apt-get update -y
              apt-get install -y --no-install-recommends rsync
              opam pin add -n -y -k git rocq-iris.dev git+https://gitlab.mpi-sws.org/iris/iris.git#93c7df745a0485cebcb97ca77e7d263e5c920d4f
              opam pin add -n -y -k git rocq-clutch.dev git+https://github.com/logsem/clutch.git#42fed67650c9a3dffb523c383fbeda9da582a97f
              opam pin add -n -y -k git coq-autosubst.dev git+https://github.com/coq-community/autosubst#50dfe574c0bd415925eea47c1f5b1a533aa85269
              opam pin add -n -y -k path $PACKAGE $WORKDIR
              opam install --confirm-level=unsafe-yes -j 2 $PACKAGE --deps-only --ignore-constraints-on=rocq-stdpp
            endGroup
          script: |
            startGroup Build
              make -j2
            endGroup
          uninstall: |
            make clean

